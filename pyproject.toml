[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recursos-didacticos-sistema"
version = "1.0.0"
description = "Sistema modular para la generación automatizada de recursos didácticos por materia escolar (cálculo numérico/simbólico, lógica booleana, esquemas, gráficos, LaTeX, Typst, Quarto y PDF)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AI Engineering & Architecture Team", email = "architecture@local.dev" }
]
keywords = [
  "recursos-didacticos",
  "educacion",
  "matematicas",
  "fisica",
  "logica-booleana",
  "quarto",
  "typst",
  "latex",
  "pdf",
  "visualizacion",
  "calculo-simbolico"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]

dependencies = [
  # --- Cálculo Numérico, Científico y Manejo de Unidades ---
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "pandas>=2.2.0",
  "mpmath>=1.3.0",
  "pint>=0.24.0",

  # --- Cálculo Simbólico y Generación LaTeX ---
  "sympy>=1.13.0",
  "pylatex>=1.4.2",

  # --- Lógica Booleana, Esquemas de Circuitos y Tablas de Verdad ---
  "schemdraw>=0.19.0",
  "boolean.py>=4.0",
  "tabulate>=0.9.0",

  # --- Visualización Gráfica (Estática y Dinámica) ---
  "matplotlib>=3.9.0",
  "seaborn>=0.13.0",
  "plotly>=5.20.0",
  "pillow>=10.0.0",

  # --- Motores de Plantillas, Quarto/Jupyter Runtime, PDF y DOCX ---
  "jinja2>=3.1.0",
  "reportlab>=4.2.0",
  "pypdf>=5.0.0",
  "markdocx>=10.0.0",
  "ipykernel>=6.29.0",
  "nbformat>=5.10.0",

  # --- Validación y Metadatos ---
  "pyyaml>=6.0",
  "jsonschema>=4.20.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]
all = [
  "recursos-didacticos-sistema[dev]"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "ARG"  # flake8-unused-arguments
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
